<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Solicitudes | Seguros Zurbano</title>
    <link rel="stylesheet" type="text/css" href="estilos/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-pagina="solicitudes">
    <nav class="navbar">
        <span id="logo" style="color: white; font-weight: bold; font-size: 20px;">PANEL DE GESTIÓN</span>
        <input type="checkbox" id="check">
        <label for="check" id="checkboton"><i class="fa-solid fa-bars"></i></label>
        <ul class="menu-items">
            <li><a href="clientes.html" class="btn-nav-especial" style="background: transparent !important; border: none !important;"><i class="fa-solid fa-address-book"></i> Clientes</a></li>
            <li><a href="usuarios.html" class="btn-nav-especial" style="background: transparent !important; border: none !important;"><i class="fa-solid fa-users-gear"></i> Equipo</a></li>
            <li><a href="login.html" class="btn-nav-especial"  data-salir><i class="fa-solid fa-right-from-bracket"></i> Salir</a></li>
        </ul>
    </nav>

  <div class="panel-container">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2 style="color: #D32F2F;">Bandeja de Solicitudes</h2>
                <p style="font-size: 14px; color: #666;">Bienvenido, <span id="nombre-usuario"></span></p>
            </div>
            <a href="nuevoCliente.html" class="btn-actualizar-ios" style="text-decoration: none;">
                <i class="fa-solid fa-user-plus"></i> Añadir Cliente
            </a>
        </div>
        <table>
            <thead>
                <tr><th>ID</th><th>Fecha</th><th>Cliente</th><th>Email</th><th>Estado</th><th>Acción</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

<script src="js/app.js"></script>
</body>
</html>
