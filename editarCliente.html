<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente | Seguros Zurbano</title>
    <link rel="stylesheet" type="text/css" href="estilos/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-pagina="editarCliente">
    <nav class="navbar">
        <span id="logo" style="color: white; font-weight: bold; font-size: 20px;">EDITAR DATOS CLIENTE</span>
        <input type="checkbox" id="check">
        <label for="check" id="checkboton"><i class="fa-solid fa-bars"></i></label>
        <ul class="menu-items">
            <li><a href="clientes.html" class="btn-nav-especial" ><i class="fa-solid fa-xmark"></i> Cancelar</a></li>
        </ul>
    </nav>

    <div class="panel-container" style="max-width: 500px; margin-top: 120px;">
        <h2 style="color: #D32F2F; margin-bottom: 20px;"><i class="fa-solid fa-user-pen"></i> Modificar Cliente</h2>
        <form id="form" class="formulario">
            <input type="text" name="nombre" required>
            <input type="email" name="email" required>
            <input type="tel" name="movil">
            <button type="submit"><i class="fa-solid fa-floppy-disk"></i> ACTUALIZAR CLIENTE</button>
        </form>
    </div>

<script src="js/app.js"></script>
</body>
</html>
